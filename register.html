<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fce4ec, #e8eaf6, #e0f7fa);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            width: 420px;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #6a4c93;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #4a4a4a;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;

            border: 1px solid #d8cce8;
            border-radius: 10px;

            outline: none;
            font-size: 14px;
            background-color: #faf8ff;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #9b72cf;
            box-shadow: 0 0 6px rgba(155, 114, 207, 0.3);
        }

        textarea {
            height: 80px;
            resize: none;
        }

        .gender {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }

        .gender label {
            font-weight: normal;
            margin: 0;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(90deg, #8e6bbf, #c084b8);
            color: white;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(90deg, #7655a5, #a85d99);
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h1>Registration Form</h1>

        <p class="subtitle">Create your account ✨</p>

        <form>

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob">

            <label>Gender</label>

            <div class="gender">
                <label>
                    <input type="radio" name="gender"> Female
                </label>

                <label>
                    <input type="radio" name="gender"> Male
                </label>

                <label>
                    <input type="radio" name="gender"> Other
                </label>
            </div>


            <label for="message">Address</label>
            <textarea id="message" placeholder="Enter your address"></textarea>

            <button type="submit">Register</button>


            <center><a href="myindex.html" class="button">Back to index</a></center>



        </form>

    </div>

</body>

</html>
